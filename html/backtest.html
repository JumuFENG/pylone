<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回测分析 - phoniun交易系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/deals.css">
    <link rel="stylesheet" href="/static/css/backtest.css">
</head>
<body>
    <div class="container" style="width: 98%;">
        <div id="alert" style="display: none; position: fixed; top: 100px; left: 50%; transform: translateX(-50%); z-index: 1000;"></div>
        <div id="loading" class="loading">加载中...</div>
        
        <div class="nav">
            <div style="margin-left: 150px;">策略回测分析 <a href="/html/validator.html" style="margin-left: 20px; font-size: 14px; color: #1890ff;">公式验证工具</a></div>
            <div class="nav-links"></div>
        </div>
        
        <div class="content" style="flex-direction: column;">
            <div class="params-panel">
                <div class="params-header" onclick="toggleParams()">
                    <span>参数设置</span>
                    <span id="toggle-icon">▼</span>
                </div>
                
                <div class="params-body" id="params-body">
                    <div class="tab-nav">
                        <button class="tab-btn active" data-tab="tab-conditions" onclick="switchTab('tab-conditions')">选股条件</button>
                        <button class="tab-btn" data-tab="tab-advanced" onclick="switchTab('tab-advanced')">高级设置</button>
                    </div>
                    
                    <div class="tab-content">
                        <div class="tab-pane active" id="tab-conditions">
                            <div class="conditions-layout">
                                <div class="condition-col">
                                    <div class="col-title">基础设置</div>
                                    
                                    <div class="form-group">
                                        <label>预设方案</label>
                                        <select id="preset_select" autocomplete="off" onchange="loadPreset()">
                                            <option value="">-- 请选择方案 --</option>
                                            <option value="ma多头">均线多头排列</option>
                                            <option value="ma_cross">均线金叉买入</option>
                                            <option value="break_high">突破高点</option>
                                            <option value="consecutive_up">连续上涨</option>
                                            <option value="custom">自定义</option>
                                        </select>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>股票池</label>
                                        <select id="stock_pool">
                                            <option value="all">全部股票</option>
                                            <option value="sh">上海主板</option>
                                            <option value="sz">深圳主板</option>
                                            <option value="cy">创业板</option>
                                            <option value="ke">科创板</option>
                                            <option value="bj">北交所</option>
                                        </select>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>开始日期</label>
                                        <input type="date" id="start_date">
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>结束日期</label>
                                        <input type="date" id="end_date">
                                    </div>
                                </div>
                                
                                <div class="condition-col">
                                    <div class="col-title">买入条件</div>
                                    
                                    <div class="form-group">
                                        <label>条件类型</label>
                                        <select id="buy_condition_type" autocomplete="off" onchange="updateBuyConditionUI()">
                                            <option value="ma_cross">MA均线交叉</option>
                                            <option value="consecutive_up">连续上涨</option>
                                            <option value="consecutive_down">连续下跌</option>
                                            <option value="break_high">突破高点</option>
                                            <option value="break_low">跌破低点</option>
                                            <option value="volume_spike">量能突增</option>
                                            <option value="formula">自定义公式</option>
                                        </select>
                                    </div>
                                    
                                    <div id="buy_params">
                                        <div class="form-group">
                                            <label>快速周期</label>
                                            <input type="number" id="fast_period" value="5" onchange="generateBuyFormula()">
                                        </div>
                                        <div class="form-group">
                                            <label>慢速周期</label>
                                            <input type="number" id="slow_period" value="10" onchange="generateBuyFormula()">
                                        </div>
                                        <div class="form-group">
                                            <label>方向</label>
                                            <select id="direction" onchange="generateBuyFormula()">
                                                <option value="up">多头(上穿)</option>
                                                <option value="down">空头(下穿)</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group" id="period_group" style="display:none;">
                                        <label>周期数</label>
                                        <input type="number" id="period" value="20" onchange="generateBuyFormula()">
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>买入价格</label>
                                        <select id="buy_price_type">
                                            <option value="next_open" selected>次日开盘价</option>
                                            <option value="trigger">触发价(当日最高)</option>
                                            <option value="close">当日收盘价</option>
                                            <option value="high">当日最高价</option>
                                        </select>
                                    </div>
                                    
                                    <div class="form-group" id="buy_formula_group">
                                        <textarea id="buy_formula_input" placeholder="选择条件后自动生成公式，也可自定义"></textarea>
                                    </div>
                                </div>
                                
                                <div class="condition-col">
                                    <div class="col-title">卖出条件</div>
                                    
                                    <div id="sell_conditions_list"></div>
                                    
                                    <div class="sell-add-form">
                                        <div class="form-group">
                                            <label>条件类型</label>
                                            <select id="sell_add_type" autocomplete="off" onchange="updateSellAddForm()">
                                                <option value="ma_cross">MA均线死叉</option>
                                                <option value="profit_target" selected>止盈</option>
                                                <option value="stop_loss">止损</option>
                                                <option value="hold_days">持仓天数</option>
                                                <option value="break_low">跌破低点</option>
                                                <option value="consecutive_down">连续下跌</option>
                                                <option value="formula">自定义公式</option>
                                            </select>
                                        </div>
                                        
                                        <div id="sell_add_params">
                                            <div class="form-group sell-pct-group">
                                                <label>百分比(%)</label>
                                                <input type="number" id="sell_add_pct" value="20" step="0.1">
                                            </div>
                                            <div class="sell-ma-group" style="display:none;">
                                                <div class="form-group">
                                                    <label>快速周期</label>
                                                    <input type="number" id="sell_add_fast" value="5">
                                                </div>
                                                <div class="form-group">
                                                    <label>慢速周期</label>
                                                    <input type="number" id="sell_add_slow" value="10">
                                                </div>
                                            </div>
                                            <div class="form-group sell-period-group" style="display:none;">
                                                <label>周期(天)</label>
                                                <input type="number" id="sell_add_period" value="20">
                                            </div>
                                            <div class="form-group sell-days-group" style="display:none;">
                                                <label>持仓(天)</label>
                                                <input type="number" id="sell_add_days" value="3">
                                            </div>
                                            <div class="form-group sell-formula-group" style="display:none;">
                                                <textarea type="text" id="sell_add_formula" placeholder="输入公式"></textarea>
                                            </div>
                                        </div>
                                        
                                        <div class="form-group">
                                            <label>价格</label>
                                            <select id="sell_add_price_type">
                                                <option value="trigger" selected>触发价</option>
                                                <option value="next_open">次开</option>
                                                <option value="close">收盘</option>
                                                <option value="low">最低</option>
                                                <option value="high">最高</option>
                                            </select>
                                        </div>
                                        
                                        <button type="button" class="btn-small" onclick="addSellCondition()">+ 添加</button>
                                    </div>
                                    
                                    <button type="button" class="btn-primary btn-full" style="margin-top: 15px;" id="get-signals" onclick="getSignals()">
                                        获取买卖信号
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="tab-pane" id="tab-advanced">
                            <div class="advanced-layout">
                                <div class="advanced-col">
                                    <div class="col-title">资金管理</div>
                                    
                                    <div class="form-group">
                                        <label>买入模式</label>
                                        <select id="buy_mode">
                                            <option value="fixed">固定金额</option>
                                            <option value="percent">按比例</option>
                                        </select>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>每只买入金额</label>
                                        <input type="number" id="buy_amount" value="10000">
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>初始资金</label>
                                        <input type="number" id="init_capital" value="100000" step="10000">
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>最大持仓数</label>
                                        <input type="number" id="max_positions" value="5">
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>每日买入限制</label>
                                        <input type="number" id="daily_limit" value="3">
                                    </div>
                                </div>
                                
                                <div class="advanced-col">
                                    <div class="col-title">交易成本</div>
                                    
                                    <div class="form-group">
                                        <label>手续费率</label>
                                        <input type="number" id="fee_rate" value="0.0003" step="0.0001">
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>滑点比率</label>
                                        <input type="number" id="slippage" value="0.001" step="0.001">
                                    </div>
                                </div>
                                
                                <div class="advanced-col">
                                    <div class="col-title">择时设置</div>
                                    
                                    <div class="form-group">
                                        <label>启用择时</label>
                                        <select id="timing_enabled">
                                            <option value="0">不启用</option>
                                            <option value="1">启用</option>
                                        </select>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>大盘代码</label>
                                        <input type="text" id="market_code" value="sh000001" placeholder="如: sh000001">
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>择时条件</label>
                                        <select id="timing_condition">
                                            <option value="change_lt">涨跌幅 &lt;</option>
                                            <option value="ma_below">收盘价 &lt; MA(N)</option>
                                        </select>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>阈值</label>
                                        <input type="number" id="timing_threshold" value="-2" step="0.5">
                                    </div>
                                    
                                    <button type="button" class="btn-primary btn-full" style="margin-top: 15px;" id="run-backtest" onclick="runBacktest()">
                                        再次回测
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="results-section" style="display: none;">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">总收益率</div>
                        <div class="stat-value" id="total-profit-pct">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">胜率</div>
                        <div class="stat-value" id="win-rate">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">交易次数</div>
                        <div class="stat-value" id="total-trades">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">最大回撤</div>
                        <div class="stat-value" id="max-drawdown">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">盈利次数</div>
                        <div class="stat-value" id="winning-trades">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">亏损次数</div>
                        <div class="stat-value" id="losing-trades">--</div>
                    </div>
                </div>
                
                <div class="chart-section">
                    <h4>资金曲线</h4>
                    <div id="capital-chart" style="width: 100%; height: 350px;"></div>
                </div>
                
                <div class="chart-section">
                    <h4>交易记录</h4>
                    <div style="max-height: 450px; overflow-y: auto;">
                        <table class="trade-table" id="trade-table">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>股票</th>
                                    <th>操作</th>
                                    <th>价格</th>
                                    <th>数量</th>
                                    <th>金额</th>
                                    <th>手续费</th>
                                    <th>原因</th>
                                    <th>收益</th>
                                    <th>收益率%</th>
                                </tr>
                            </thead>
                            <tbody id="trade-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div id="empty-state" style="text-align: center; padding: 60px; color: #999;">
                <p>请设置回测参数并点击"获取买卖信号"</p>
            </div>
        </div>
    </div>
    
    <script src="/static/vender/echarts.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/guang.js"></script>
    <script src="/static/js/backtest.js"></script>
</body>
</html>
